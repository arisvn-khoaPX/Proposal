(()=>{'use strict';const C=window.CONTENT,M=window.ACTION_TRACE,I=window.I18N;let lang='ja',page=0,selected='T1',active='A1.1',actionPhase='all',alignmentOpen=false;const $=id=>document.getElementById(id),e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const t=()=>I[lang];const cleanId=x=>String(x).replace(/^[TA]\d+(?:\.\d+)?\s*[・:—-]?\s*/, '');const target=x=>C.targets.find(z=>z[0]===x);const targetName=x=>target(x)[lang==='ja'?1:lang==='vi'?3:2];const actionName=id=>M[id].title[lang];const keys=Object.keys(M);const actionsFor=id=>keys.filter(k=>k.startsWith('A'+id.slice(1)+'.'));const pill=(v,c='')=>`<span class="pill ${c}">${e(v)}</span>`;function go(n){page=n;render();window.scrollTo(0,0)}function localized(a,key){return a[key+'_i18n']?.[lang]||a[key]}function row(label,value){return `<div class="trace-row"><div class="trace-label">${e(label)}</div><div class="trace-value">${e(value)}</div></div>`}function header(title,sub=''){return ''}function overviewOutcomes(){const z={ja:{title:'リリース後に貴社が得られるもの',sub:'成果は保証値ではなく、導入前ベースラインとパイロットで検証します。',flow:['機会を発見','根拠付きで提案','MDが承認','実績を検証'],items:[['粗利・スペース収益性','粗利額・棚当たり利益・GMROI'],['欠品・販売機会損失','欠品率・欠品時間・推定逸失売上'],['過剰在庫・廃棄','在庫日数・滞留在庫・廃棄率'],['発注・業務効率','提案採用率・例外処理・作業時間']],foot:'計測：導入前後 + 比較対象、データ品質、施策実施日を記録。改善幅はDiscoveryで合意。'},en:{title:'What the customer can measure after release',sub:'Illustrative outcomes—not guaranteed uplift. Validate against approved baselines during the pilot.',flow:['Detect opportunity','Recommend with evidence','MD approves','Measure actual impact'],items:[['Profit & space productivity','Gross profit ・ profit per shelf ・ GMROI'],['Stockouts & lost sales','Stockout rate ・ duration ・ estimated lost sales'],['Excess inventory & waste','Inventory days ・ aging stock ・ waste rate'],['Ordering & MD efficiency','Adoption rate ・ exceptions ・ time spent']],foot:'Measurement: before/after with comparison groups, data-quality checks and intervention dates. Targets agreed during Discovery.'},vi:{title:'Kết quả khách hàng có thể đo sau khi release',sub:'Đây là kết quả kỳ vọng, không cam kết tỷ lệ cải thiện. Kiểm chứng với baseline và pilot.',flow:['Phát hiện cơ hội','Đề xuất có bằng chứng','MD phê duyệt','Đo hiệu quả thực tế'],items:[['Lợi nhuận & hiệu quả không gian','Lợi nhuận gộp ・ lợi nhuận/mét kệ ・ GMROI'],['Thiếu hàng & mất doanh số','Tỷ lệ thiếu hàng ・ thời gian ・ doanh số mất ước tính'],['Tồn kho dư & lãng phí','Ngày tồn kho ・ tồn lâu ngày ・ tỷ lệ hủy'],['Hiệu suất đặt hàng & MD','Tỷ lệ áp dụng ・ ngoại lệ ・ thời gian xử lý']],foot:'Đo lường trước/sau có nhóm đối chiếu, kiểm tra chất lượng dữ liệu và ngày thực hiện. Mục tiêu xác nhận trong Discovery.'}}[lang];const W=920,centers=[115,345,575,805];const colors=['#e7f1fd','#f0eaff','#e4f5eb','#e7f1fd'];const svg=`<svg class="outcome-svg" viewBox="0 0 ${W} 118" role="img" aria-label="${e(z.flow.join(' → '))}"><defs><marker id="outcomeArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#7892af" stroke-width="1.4"/></marker></defs>${centers.slice(0,3).map((x,i)=>`<path d="M${x+97} 56 H${centers[i+1]-99}" stroke="#7892af" stroke-width="2.5" marker-end="url(#outcomeArrow)"/>`).join('')}${centers.map((x,i)=>`<rect x="${x-100}" y="24" width="200" height="64" rx="12" fill="${colors[i]}" stroke="${i===2?'#259667':'#7a9ec8'}" stroke-width="2"/><circle cx="${x-73}" cy="56" r="13" fill="${i===2?'#259667':'#3d7cb7'}"/><text x="${x-73}" y="60" text-anchor="middle" fill="white" font-size="13" font-weight="700">${i+1}</text><text x="${x+12}" y="61" text-anchor="middle" font-size="14" font-weight="650" fill="#17344f">${e(z.flow[i])}</text>`).join('')}</svg>`;return `<section class="outcome-section"><div class="outcome-heading"><h2>${e(z.title)}</h2><p>${e(z.sub)}</p></div><div class="outcome-steps">${z.flow.map((x,i)=>`<div class="outcome-step"><span>${i+1}</span><strong>${e(x)}</strong></div>`).join('')}</div><div class="outcome-kpis">${z.items.map((x,i)=>`<article class="outcome-kpi"><div class="outcome-kpi-index">0${i+1}</div><strong>${e(x[0])}</strong><small>${e(x[1])}</small></article>`).join('')}</div><div class="outcome-foot">${e(z.foot)}</div></section>`}function customerAlignment(){const q={ja:{head:'貴社の業務方法論との整合性（6ステップ）',sub:'CPMの既存機能は再開発せず、AI拡張が支援する判断・検証を明確にします。',steps:[['1. 店舗・カテゴリー選定','経済的GMROIと粗利・スペース生産性を基に重点対象を選定','既存KPIを活用／優先順位付けを追加'],['2. SKU分析・原因特定','RSC照会、欠品・滞留在庫、SKU別GMROI×スペース生産性','既存RSCを再利用／根拠の整理を追加'],['3. 改善案の立案','推奨フェイス数を参照し、制約付きで候補を比較','CPMの推奨値を再利用／代替案を追加'],['4. 売場への反映','MD承認後に既存の登録・店舗作業へ引き継ぐ','自動書き戻しは未確定'],['5. 自動発注との連動','経済的基準在庫に基づく既存発注を維持','既存発注エンジンを再開発しない'],['6. 効果測定・PDCA','2週間～1か月後の粗利・欠品・自発率を追跡','比較・証跡・改善サイクルを追加']],gm:'経済的GMROIを主要な意思決定軸として強調',gms:'カテゴリーの4象限：粗利率 × 理論在庫回転率。SKUの4象限：経済的GMROI × スペース生産性。算式・閾値・経済的基準在庫は貴社と確認します。',env:'既存・新規の稼働環境（要確認）',env1:'既存 IF/CPM：Windows EC2、JP1/AJS3、PowerShell、MariaDB 11.3.2（提供済み技術資料に基づく）',env2:'既存 EOB：Kotlin Multiplatform / Compose、Android・Windows、JDBC・ストアドプロシージャ',env3:'新規 AI 拡張：Windows互換またはLinuxの専用環境を候補として評価。Docker・n8n・GitLab CI/CDは提案であり導入済みではありません。',env4:'ネットワーク、権限、OS、コンテナ利用可否、運用責任、リリース・ロールバックはDiscoveryで確定。'},en:{head:'Coverage against the customer’s six-step methodology',sub:'Reuse existing CPM capabilities; show where proposed AI adds decision support and evidence.',steps:[['1. Select store/category','Prioritize with economic GMROI, margin and space productivity','Reuse KPIs; add opportunity ranking'],['2. Diagnose SKU/root cause','Use RSC, stockouts, aging stock and GMROI × space productivity','Reuse RSC; add evidence summaries'],['3. Plan interventions','Use recommended facings; compare constrained alternatives','Reuse CPM values; add scenario comparisons'],['4. Execute in store','MD approval, then existing registration and store changes','Automatic write-back not assumed'],['5. Integrate auto-ordering','Retain existing ordering based on economic reference inventory','Do not rebuild CPM ordering'],['6. Measure & PDCA','Review margin, stockouts and adherence after 2–4 weeks','Add comparison and audit trail']],gm:'Economic GMROI is a core decision metric',gms:'Category quadrant: gross margin rate × theoretical inventory turnover. SKU quadrant: economic GMROI × space productivity. Formula, thresholds and reference inventory require customer validation.',env:'Existing vs proposed runtime environments',env1:'Existing IF/CPM: Windows EC2, JP1/AJS3, PowerShell, MariaDB 11.3.2 (based on previously supplied technical inventory)',env2:'Existing EOB: Kotlin Multiplatform / Compose, Android and Windows, JDBC and stored procedures',env3:'New AI extension: evaluate a Windows-compatible deployment or separate Linux environment. Docker, n8n and GitLab CI/CD are candidates, not installed customer components.',env4:'Confirm network access, permissions, OS, container policy, ownership, release and rollback during Discovery.'},vi:{head:'Đối chiếu 6 bước phương pháp luận khách hàng',sub:'Tái sử dụng CPM hiện hữu, chỉ bổ sung hỗ trợ quyết định và bằng chứng.',steps:[['1. Chọn cửa hàng/category','Ưu tiên theo GMROI kinh tế, biên lợi nhuận và hiệu suất không gian','Tái sử dụng KPI; thêm xếp hạng cơ hội'],['2. Phân tích SKU/nguyên nhân','Dùng RSC, thiếu hàng, tồn lâu và GMROI × năng suất không gian','Tái sử dụng RSC; thêm tổng hợp bằng chứng'],['3. Lập phương án','Dùng số facing khuyến nghị; so sánh phương án có ràng buộc','Tái sử dụng CPM; thêm so sánh kịch bản'],['4. Triển khai tại cửa hàng','MD phê duyệt rồi dùng quy trình đăng ký và thay đổi hiện hữu','Chưa giả định ghi ngược tự động'],['5. Kết hợp đặt hàng tự động','Giữ engine đặt hàng theo tồn kho chuẩn kinh tế','Không làm lại đặt hàng CPM'],['6. Đo lường & PDCA','Đánh giá lãi gộp, thiếu hàng, tuân thủ sau 2–4 tuần','Thêm đối chứng và truy vết']],gm:'GMROI kinh tế là KPI trọng tâm để ra quyết định',gms:'Ma trận category: biên lợi nhuận × vòng quay tồn kho lý thuyết. Ma trận SKU: GMROI kinh tế × năng suất không gian. Công thức, ngưỡng và tồn kho chuẩn cần KH xác nhận.',env:'Môi trường hiện hữu và môi trường đề xuất',env1:'IF/CPM hiện hữu: Windows EC2, JP1/AJS3, PowerShell, MariaDB 11.3.2 (theo tài liệu kỹ thuật đã cung cấp)',env2:'EOB hiện hữu: Kotlin Multiplatform / Compose, Android và Windows, JDBC và stored procedures',env3:'AI Extension mới: đánh giá triển khai tương thích Windows hoặc Linux riêng. Docker, n8n, GitLab CI/CD chỉ là ứng viên đề xuất.',env4:'Chốt network, quyền, OS, chính sách container, vận hành, release và rollback trong Discovery.'}}[lang];return `<section class="alignment-section"><h2>${e(q.head)}</h2><p>${e(q.sub)}</p><div class="alignment-grid">${q.steps.map((a,i)=>`<article class="alignment-step"><div class="alignment-index">${i+1}</div><strong>${e(a[0])}</strong><p>${e(a[1])}</p><small>${e(a[2])}</small></article>`).join('')}</div><div class="gmroi-highlight"><strong>★ ${e(q.gm)}</strong><p>${e(q.gms)}</p></div></section>`}function envComparison(){const z={ja:['既存・新規の稼働環境（要確認）','既存 IF/CPM','Windows EC2 ・ JP1/AJS3 ・ PowerShell ・ MariaDB 11.3.2','既存 EOB','Android / Windows ・ Kotlin Multiplatform ・ JDBC / SP','提案 AI 拡張','既存EC2上のWindowsサービス または 分離Linux VM（Discoveryで選定）','JP1/AJS3がIF完了後にAIジョブを起動し、読み取り専用アカウント／レプリカ経由で参照。n8nは通知用途のみの任意候補。OS・ネットワーク・運用・復旧方式は未確定。'],en:['Existing and proposed runtime environments','Existing IF/CPM','Windows EC2 ・ JP1/AJS3 ・ PowerShell ・ MariaDB 11.3.2','Existing EOB','Android / Windows ・ Kotlin Multiplatform ・ JDBC / SP','Proposed AI extension','Windows service on the existing EC2 or a separate Linux VM (select in Discovery)','JP1/AJS3 triggers AI jobs after IF batches; data is read via a read-only account / replica. n8n is an optional, notification-only candidate. OS, network, ownership and recovery require confirmation.'],vi:['Môi trường hiện hữu và đề xuất','IF/CPM hiện hữu','Windows EC2 ・ JP1/AJS3 ・ PowerShell ・ MariaDB 11.3.2','EOB hiện hữu','Android / Windows ・ Kotlin Multiplatform ・ JDBC / SP','AI Extension đề xuất','Windows service trên EC2 hiện hữu hoặc Linux VM riêng (chọn trong Discovery)','JP1/AJS3 gọi job AI sau IF batch; đọc dữ liệu qua tài khoản chỉ đọc / replica. n8n chỉ là tuỳ chọn cho thông báo. OS, mạng, vận hành và khôi phục cần xác nhận.']}[lang];return `<section class="env-section"><h2>${e(z[0])}</h2><div class="env-grid">${[1,3,5].map((k,i)=>`<article class="env-card ${i===2?'env-proposed':''}"><strong>${e(z[k])}</strong><p>${e(z[k+1])}</p></article>`).join('')}</div><p class="env-note">${e(z[7])}</p></section>`}function executiveExample(){const q={ja:{label:'意思決定の例（説明用・実績値ではありません）',title:'経済的GMROIが高いのに棚スペースが不足している場合',a:'検出：高い収益力と欠品・陳列不足のギャップ',b:'提案：推奨フェイス数と制約を考慮した配分案',c:'承認：MDが根拠と影響を確認',d:'検証：変更前後の粗利・欠品・スペース生産性を比較',note:'実際の計算式・制約・成果目標はDiscoveryで確認します。'},en:{label:'Illustrative decision scenario — not customer performance',title:'High Economic GMROI, but insufficient shelf space',a:'Detect: profitable SKU with stockout / facing gap',b:'Recommend: constrained facing allocation using CPM reference values',c:'Approve: MD checks evidence and impact',d:'Measure: compare gross profit, stockouts and space productivity',note:'Confirm formulas, constraints and success targets during Discovery.'},vi:{label:'Ví dụ quyết định minh họa — không phải kết quả thực tế của KH',title:'GMROI kinh tế cao nhưng thiếu không gian trưng bày',a:'Phát hiện: SKU hiệu quả nhưng thiếu hàng / thiếu facing',b:'Đề xuất: phân bổ facing có ràng buộc theo dữ liệu CPM',c:'Phê duyệt: MD kiểm tra bằng chứng và tác động',d:'Đo lường: so sánh lãi gộp, thiếu hàng và hiệu quả không gian',note:'Công thức, ràng buộc và mục tiêu sẽ xác nhận trong Discovery.'}}[lang];return `<section class="executive-example"><div class="example-head"><span class="example-kicker">${e(q.label)}</span><h2>${e(q.title)}</h2></div><div class="example-steps">${[q.a,q.b,q.c,q.d].map((x,i)=>`<div class="example-step"><span>${i+1}</span><p>${e(x)}</p></div>`).join('')}</div><small>${e(q.note)}</small></section>`}function overviewGlossary(){const q={ja:{title:'用語集',sub:'主要な略語（役割と指標）',entries:[['FTE','Full-Time Equivalent','フルタイム換算の稼働量。0.5 FTEはフルタイム1名分の50%の稼働を意味します（人数ではありません）。'],['MD','Merchandiser','商品・カテゴリー担当者。分析・施策判断・承認を行います。'],['経済的GMROI','Economic GMROI','経済的基準在庫を用いた在庫投資効率。CPMの承認済み定義を使用します。'],['RSC','RSC','CPM_UIの照会機能。詳細な定義はDiscoveryで確認します。'],['PDCA','Plan–Do–Check–Act','施策の計画・実施・効果検証・改善。']]},en:{title:'Terminology',sub:'Key roles and measures',entries:[['FTE','Full-Time Equivalent','Staffing capacity: 0.5 FTE equals half of one full-time workload, not necessarily half a person.'],['MD','Merchandiser','Person responsible for merchandise/category decisions and approval.'],['Economic GMROI','Economic GMROI','Inventory return using economic reference inventory; use the customer-approved CPM definition.'],['RSC','RSC','Existing CPM_UI inquiry function; confirm the formal acronym expansion with the customer.'],['PDCA','Plan–Do–Check–Act','Continuous improvement through planning, execution, measurement and adjustment.']]},vi:{title:'Giải thích thuật ngữ',sub:'Vai trò và chỉ số chính',entries:[['FTE','Full-Time Equivalent','Nhân sự quy đổi toàn thời gian: 0,5 FTE tương đương 50% công suất một nhân sự toàn thời gian.'],['MD','Merchandiser','Người phụ trách hàng hóa/ngành hàng, phân tích và phê duyệt phương án.'],['GMROI kinh tế','Economic GMROI','Hiệu quả vốn tồn kho dựa trên tồn kho chuẩn kinh tế; dùng định nghĩa CPM được KH duyệt.'],['RSC','RSC','Chức năng tra cứu hiện hữu của CPM_UI; cần xác nhận tên đầy đủ với KH.'],['PDCA','Plan–Do–Check–Act','Lập kế hoạch, thực hiện, kiểm tra hiệu quả và cải tiến.']]}}[lang];return `<details class="overview-glossary"><summary><strong>${e(q.title)}</strong><span>${e(q.sub)}</span></summary><div class="glossary-grid">${q.entries.map(a=>`<div class="glossary-term"><strong>${e(a[0])}</strong><small>${e(a[1])}</small><p>${e(a[2])}</p></div>`).join('')}</div></details>`}function home(){const v={ja:{before:'現状 / AS-IS',after:'AI統合後 / TO-BE',business:'業務',tech:'技術',out:'期待成果',old1:'既存の分析・発注機能',old2:'MDが分析・改善策を判断',new1:'利益機会を自動抽出・比較',new2:'MDが根拠付き提案を承認',sys:'CPM_UI / RSC / IF / EOB',ext:'JP1 → データ抽出 → KPI分析 → ダッシュボード・レビュー',kpi:'売上・粗利・在庫・欠品',value:'改善前後の利益・工数を検証',keep:'既存機能を維持',propose:'新規開発候補'},en:{before:'CURRENT / AS-IS',after:'AI-INTEGRATED / TO-BE',business:'Business',tech:'Technical',out:'Expected result',old1:'Existing analytics & ordering',old2:'MD analyzes and chooses actions',new1:'Detect and compare profit opportunities',new2:'MD approves evidence-backed options',sys:'CPM_UI / RSC / IF / EOB',ext:'JP1 → データ抽出 → KPI分析 → ダッシュボード・レビュー',kpi:'Sales ・ profit ・ stock ・ stockouts',value:'Verify profit and workload before/after',keep:'Retain existing capabilities',propose:'Proposed new extension'},vi:{before:'HIỆN TẠI / AS-IS',after:'SAU TÍCH HỢP AI / TO-BE',business:'Nghiệp vụ',tech:'Kỹ thuật',out:'Kết quả kỳ vọng',old1:'Phân tích và đặt hàng hiện hữu',old2:'MD tự phân tích và chọn giải pháp',new1:'Phát hiện và so sánh cơ hội lợi nhuận',new2:'MD duyệt đề xuất có bằng chứng',sys:'CPM_UI / RSC / IF / EOB',ext:'JP1 → データ抽出 → KPI分析 → ダッシュボード・レビュー',kpi:'Doanh thu ・ lợi nhuận ・ tồn ・ thiếu hàng',value:'Đo lường lợi nhuận và công sức trước/sau',keep:'Giữ chức năng hiện hữu',propose:'Đề xuất phát triển mới'}}[lang];return `${executiveSummary()}${window.PROPOSAL_SIX_STEP_V36.render(lang)}<div class="overview-flow"><div class="overview-flow-head"><strong>${e(v.before)}</strong><span>→</span><strong>${e(v.after)}</strong></div>${[[v.business,v.old1,v.new1],[v.business,v.old2,v.new2],[v.tech,v.sys,v.ext],[v.out,v.kpi,v.value]].map((r,i)=>`<div class="overview-flow-row"><div class="overview-flow-label">${e(r[0])}</div><div class="overview-flow-old">${e(r[1])}</div><div class="overview-flow-arrow">→</div><div class="overview-flow-new">${e(r[2])}</div></div>`).join('')}<div class="overview-flow-legend"><span>● ${e(v.keep)} ・ CPM / IF / EOB</span><span>✦ ${e(v.propose)} ・ 分析・最適化・AI</span></div></div>${overviewOutcomes()}${executiveExample()}${overviewGlossary()}${alignmentOpen?window.PROPOSAL_V24.matrix(lang):''}<button class="alignment-toggle" data-alignment-toggle="1" aria-expanded="${alignmentOpen}">${e(({ja:alignmentOpen?'6ステップ詳細を閉じる':'貴社の6ステップとの対応を見る',en:alignmentOpen?'Hide six-step methodology details':'Explore the customer’s six-step methodology',vi:alignmentOpen?'Ẩn chi tiết 6 bước':'Xem đối chiếu phương pháp luận 6 bước của KH'})[lang])} ${alignmentOpen?'−':'+'}</button><button class="primary overview-cta" data-page="1">${e(t().nav[1])} →</button>`}function funnel(){let ids=actionsFor(selected);return `<div class="funnel"><div class="funnel-goal"><span class="muted">${e(t().target)}</span><h2>${e(targetName(selected))}</h2><span>${e(t().phase)}: ${e(target(selected)[5])}</span></div><div class="action-grid">${ids.map(id=>{let a=M[id];return `<button class="action-tile phase-${a.phase} difficulty-${a.difficulty} ${active===id?'on':''}" data-action="${id}"><span class="tile-meta">${pill(a.phase)} ${pill(lang==='ja'?({low:'低',medium:'中',high:'高'}[a.difficulty]||a.difficulty):a.difficulty,a.difficulty)} ${pill(a.horizon==='near'?t().near:t().long)}</span><strong>${e(actionName(id))}</strong><small>${e(localized(a,'result'))}</small></button>`}).join('')}</div></div><div class="action-summary">${trace(active,true)}</div>`}function trace(id,compact=false){let a=M[id];if(!a)return '';return `<div class="trace"><div class="trace-top"><div><span class="muted">${e(t().detail)}</span><h2>${e(actionName(id))}</h2></div><div>${pill(a.phase)} ${pill(lang==='ja'?({low:'低',medium:'中',high:'高'}[a.difficulty]||a.difficulty):a.difficulty,a.difficulty)} ${pill(a.horizon==='near'?t().near:t().long)}</div></div><div class="trace-columns"><div>${row(t().develop,localized(a,'develop'))}${row(t().logic,localized(a,'logic'))}${row(t().result,localized(a,'result'))}</div><div>${row(t().reuse,localized(a,'reuse'))}${row(t().accept,localized(a,'accept'))}${row(t().kpi,localized(a,'kpi'))}${row(t().data,localized(a,'inputs')||a.data.join(' ・ '))}${row(t( hi vào production',value:'Ba giá trị',vals:['Ưu tiên cơ hội và giảm thời gian phân tích của MD','Quyết định dựa trên bằng chứng và ràng buộc','Đo lường lợi nhuận, tồn kho và thiếu hàng sau triển khai'],time:'Thời gian dự kiến',timeText:'Khoảng 32 tuần tham khảo. Phạm vi, effort và báo giá riêng sẽ xác nhận sau Discovery.',next:'Bước tiếp theo',nextText:'Thống nhất lịch Discovery, quyền đọc dữ liệu, cửa hàng pilot và 1–2 category, người quyết định phía khách hàng.'}}[lang];return `<section class="v37-summary"><h2>${e(z.title)}</h2><div class="v37-summary-grid"><article><h3>${e(z.purpose)}</h3><p>${e(z.purposeText)}</p></article><article><h3>${e(z.scope)}</h3><p>${e(z.yes)}</p><p><strong>${e(z.no)}</strong></p></article><article><h3>${e(z.value)}</h3><ul>${z.vals.map(x=>`<li>${e(x)}</li>`).join('')}</ul></article><article><h3>${e(z.time)}</h3><p>${e(z.timeText)}</p><h3>${e(z.next)}</h3><p>${e(z.nextText)}</p></article></div></section>`}
function nextSteps(){const z={ja:{title:'次のステップ・ご判断いただきたい事項',intro:'以下の項目とご回答予定日を初回協議で合意します。期限は未確定であり、現時点でのご対応を確約いただくものではありません。',rows:[['データ参照権限','CPM/IF/EOBの読み取り方式とアクセス責任者','Discovery開始前／初回協議で期日合意'],['パイロット対象','店舗と1～2カテゴリー、比較対象の選定','Discovery期間中／初回協議で期日合意'],['Discovery日程','業務・IT担当者を交えた確認会の設定','初回協議で期日合意'],['貴社側責任者','MD責任者、IF/EOB担当者、意思決定者の指定','Discovery開始前／初回協議で期日合意']],quote:'正式なお見積りはDiscoveryでの範囲・データ・連携方式の確認後に別途ご提示します。7.0 FTE／約46.4人月は体制検討用の参考値であり、契約上の確約ではありません。'},en:{title:'Next steps / decisions requested',intro:'Agree target dates together in the initial discussion; no deadlines are presumed.',rows:[['Data access','Read-only method and responsible data owner','Before Discovery; agree date'],['Pilot scope','Pilot stores, 1–2 categories and comparison groups','During Discovery; agree date'],['Discovery schedule','Business/IT working sessions','Agree at first meeting'],['Customer owners','MD sponsor, IF/EOB owners and decision maker','Before Discovery; agree date']],quote:'A separate commercial quotation will follow Discovery. 7.0 FTE and 46.4 person-months are illustrative, not commitments.'},vi:{title:'Bước tiếp theo / quyết định cần xác nhận',intro:'Thống nhất thời hạn trong buổi trao đổi đầu tiên, không tự đặt deadline cho khách hàng.',rows:[['Quyền dữ liệu','Cách truy xuất chỉ đọc và người phụ trách','Trước Discovery; thống nhất ngày'],['Pilot','Cửa hàng, 1–2 category, nhóm đối chứng','Trong Discovery; thống nhất ngày'],['Lịch Discovery','Họp nghiệp vụ và IT','Thống nhất buổi đầu'],['Đầu mối khách hàng','MD, IF/EOB và người quyết định','Trước Discovery; thống nhất ngày']],quote:'Báo giá gửi riêng sau Discovery. 7.0 FTE và 46,4 người-tháng chỉ là tham khảo.'}}[lang];return `<section class="v37-next"><h2>${e(z.title)}</h2><p>${e(z.intro)}</p><div class="v37-table"><table><thead><tr><th>${lang==='ja'?'ご判断事項':'Item'}</th><th>${lang==='ja'?'確認内容':'Details'}</th><th>${lang==='ja'?'目安・期日':'Timing'}</th></tr></thead><tbody>${z.rows.map(r=>`<tr>${r.map(c=>`<td>${e(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="v37-quote">${e(z.quote)}</p></section>`}
function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));const V=window.PROPOSAL_V25,counts={targets:C.targets.length,actions:keys.length};$('nav').innerHTML=V.nav(lang,page,t().nav,counts);$('crumb').textContent=V.crumb(lang,page,t().nav);$('headerHint').textContent=V.hint(lang,page,counts)||t().intro;$('app').innerHTML=[home,actionPage,existingSystems,architecture,tech,roadmap,delivery,timeline,team,risks][page]()+V.pager(lang,page,t().nav);}document.addEventListener('click',ev=>{let b=ev.target.closest('[data-lang],[data-page],[data-target],[data-action],[data-view],[data-action-phase],[data-alignment-toggle],#runSim');if(!b)return;if(b.dataset.view){document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x===b));$('beforeText').textContent=window.__overviewViews[b.dataset.view][lang][0];$('afterText').textContent=window.__overviewViews[b.dataset.view][lang][1]}else if(b.dataset.actionPhase){actionPhase=b.dataset.actionPhase;render()}else if(b.dataset.alignmentToggle){alignmentOpen=!alignmentOpen;render()}else if(b.dataset.lang){lang=b.dataset.lang;render()}else if(b.dataset.page!==undefined){go(+b.dataset.page)}else if(b.dataset.target){selected=b.dataset.target;active=actionsFor(selected).find(id=>actionPhase==='all'||M[id].phase===actionPhase)||'';render()}else if(b.dataset.action){active=b.dataset.action;render()}else if(b.id==='runMulti')runMulti()});document.addEventListener('change',ev=>{if(ev.target.id==='targetFilter'){selected=ev.target.value;active=actionsFor(selected)[0];render()}if(ev.target.id==='actionFilter'){active=ev.target.value;render()}});document.addEventListener('click',ev=>{const b=ev.target.closest('[data-resource-phase]');if(!b)return;const i=Number(b.dataset.resourcePhase);const active=b.getAttribute('aria-pressed')==='true';document.querySelectorAll('[data-resource-phase]').forEach(x=>{x.setAttribute('aria-pressed',String(!active&&Number(x.dataset.resourcePhase)===i));x.classList.toggle('selected',!active&&Number(x.dataset.resourcePhase)===i)});document.querySelectorAll('[data-resource-col]').forEach(x=>x.classList.toggle('resource-highlight',!active&&Number(x.dataset.resourceCol)===i))});$('mobileMenu').onclick=()=>document.querySelector('.sidebar').classList.toggle('open');render()})();
